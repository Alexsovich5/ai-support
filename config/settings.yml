# Application settings. Environment variables override selected keys:
# LLM_PROVIDER, OPENAI_API_KEY, OPENAI_BASE_URL, CHROMA_PERSIST_DIR,
# RETRIEVAL_PROFILE, KB_SEED_DIR and LOG_LEVEL. APP_CONFIG selects another file.
# OPENAI_API_KEY_FILE and INGEST_API_KEY_FILE name key files; the ingest key
# is never read from this file.

app:
  name: "AI IT Support"
  log_level: "INFO"

llm:
  provider: "fake"
  chat_model: "gpt-4-0125-preview"
  classification_model: "gpt-4-0125-preview"
  temperature: 0.3
  classification_temperature: 0.1
  max_tokens: 1024
  request_timeout: 30
  embedding_model: "text-embedding-3-small"

knowledge_base:
  persist_directory: "./data/chroma"
  collection_name: "it_support_kb"
  max_search_results: 5

# Relevance thresholds depend on the embedder. "openai" is for OpenAI
# embeddings, "hashing" for the offline HashingEmbeddings (in-process or stub).
retrieval_profiles:
  openai:
    chunk_size: 1000
    chunk_overlap: 200
    min_relevance_score: 0.3
    confidence_threshold: 0.4
  hashing:
    chunk_size: 400
    chunk_overlap: 80
    min_relevance_score: 0.15
    confidence_threshold: 0.2

chat:
  max_message_length: 4096
  max_context_messages: 10
  session_timeout_seconds: 1800
  max_concurrent_sessions: 200
  max_sessions_per_client: 20
  # Conversation histories kept in memory (least recently used dropped first).
  max_tracked_sessions: 1000
  max_tracked_sessions_per_client: 50

security:
  phi_detection_enabled: true
  # Extra origins allowed for state-changing requests and WebSocket upgrades;
  # same-origin requests and requests without an Origin header are always allowed.
  allowed_origins: []
  auth_failure_limit: 10
  auth_failure_window_seconds: 60

limits:
  max_request_bytes: 1048576
  # Concurrent model/embedding work, overall and per client address.
  max_concurrent_requests: 8
  max_concurrent_requests_per_client: 4

escalation:
  auto_escalate_categories:
    - "security"
    - "ehr_systems"
