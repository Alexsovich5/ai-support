# Application settings. Environment variables override selected keys:
# LLM_PROVIDER, OPENAI_API_KEY, OPENAI_BASE_URL, CHROMA_PERSIST_DIR,
# RETRIEVAL_PROFILE, KB_SEED_DIR and LOG_LEVEL. APP_CONFIG selects another file.

app:
  name: "AI IT Support"
  log_level: "INFO"

llm:
  provider: "fake"
  chat_model: "gpt-4-0125-preview"
  classification_model: "gpt-4-0125-preview"
  temperature: 0.3
  classification_temperature: 0.1
  max_tokens: 1024
  request_timeout: 30
  embedding_model: "text-embedding-3-small"

knowledge_base:
  persist_directory: "./data/chroma"
  collection_name: "it_support_kb"
  max_search_results: 5

# Relevance thresholds depend on the embedder. "openai" is for OpenAI
# embeddings, "hashing" for the offline HashingEmbeddings (in-process or stub).
retrieval_profiles:
  openai:
    chunk_size: 1000
    chunk_overlap: 200
    min_relevance_score: 0.3
    confidence_threshold: 0.4
  hashing:
    chunk_size: 400
    chunk_overlap: 80
    min_relevance_score: 0.15
    confidence_threshold: 0.2

chat:
  max_message_length: 4096
  max_context_messages: 10
  session_timeout_seconds: 1800
  max_concurrent_sessions: 200

security:
  phi_detection_enabled: true

escalation:
  auto_escalate_categories:
    - "security"
    - "ehr_systems"
