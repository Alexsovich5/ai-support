name: ai-support

x-runtime-build: &runtime-build
  context: .
  dockerfile: Dockerfile
  target: runtime

services:
  openai-stub:
    build: *runtime-build
    image: ai-support:runtime
    command: ["uvicorn", "stubs.openai_stub:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - ANONYMIZED_TELEMETRY=False
    networks:
      - ai-support
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build: *runtime-build
    image: ai-support:runtime
    ports:
      - "22700:8000"
    environment:
      - LLM_PROVIDER=openai
      - OPENAI_BASE_URL=http://openai-stub:8001/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-stub-not-a-real-key}
      - RETRIEVAL_PROFILE=hashing
      - KB_SEED_DIR=/app/data/kb
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      openai-stub:
        condition: service_healthy
    networks:
      - ai-support
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  tester:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: ai-support:dev
    environment:
      - STACK_URL=http://api:8000
      - ANONYMIZED_TELEMETRY=False
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ai-support

volumes:
  chroma_data:

networks:
  ai-support:
    name: ai-support
    ipam:
      config:
        - subnet: 172.77.0.0/24
